openapi: 3.0.3
info:
  title: ELMA 今天吃什么 API
  version: 0.4.0
  description: |
    V0.3 测试版的前后端接口契约。服务端负责高德 POI、百度 Evidence、实体匹配、跨平台一致性、风险过滤、TasteProfile、
    Low Regret 排序、多样化重排、候选池管理与按需公开 Web Evidence 深挖；客户端不得自行重算风险或排序。
servers:
  - url: /api/v1
    description: 当前服务
tags:
  - name: Recommendations
    description: 推荐、换一家、反馈与按需深挖闭环
  - name: Privacy
    description: 匿名用户数据管理

paths:
  /recommendations:
    post:
      tags: [Recommendations]
      operationId: createRecommendation
      summary: 获取一家餐厅推荐
      description: |
        根据当前位置和用餐条件建立推荐会话。服务端从附近 POI 中完成硬过滤、
        风险评估和 Low Regret 排序，并返回且只返回一家餐厅。
      parameters:
        - $ref: '#/components/parameters/AnonymousUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendationRequest'
            example:
              latitude: 28.2282
              longitude: 112.9388
              minDistance: 500
              radius: 1000
              minBudget: 20
              maxBudget: 40
              category: MEAL
              dislikes: [香菜]
      responses:
        '201':
          description: 推荐会话已建立；若召回未完整但已有环带内候选，会携带 searchNotice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 条件合法但没有可推荐餐厅，或召回未完整且所选环带内还没有候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noRecommendation:
                  value:
                    code: NO_RECOMMENDATION_AVAILABLE
                    message: 附近暂时没有符合条件的餐厅，请放宽距离或预算
                    traceId: 01J5EXAMPLETRACE
                searchIncomplete:
                  value:
                    code: POI_SEARCH_INCOMPLETE
                    message: 附近餐馆已经很多，本次还没完整翻到你选择的距离范围。试试更近一点，或选择更具体的品类。
                    traceId: 01J5EXAMPLETRACE
        '502':
          $ref: '#/components/responses/PoiProviderError'

  /recommendations/{id}/reroll:
    post:
      tags: [Recommendations]
      operationId: rerollRecommendation
      summary: 换一家
      description: |
        只在原推荐会话保存的优质候选池中切换，不重新查询或随机抽取全部 POI。
        初次推荐之外最多展示五个不同替代项；候选耗尽后的请求返回初始推荐，
        且 `alternativesRemaining=0`，不会产生第七个选择。
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
        - $ref: '#/components/parameters/AnonymousUserId'
      responses:
        '200':
          description: 当前应展示的餐厅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/RecommendationNotFound'

  /recommendations/{id}/feedback:
    post:
      tags: [Recommendations]
      operationId: submitRecommendationFeedback
      summary: 提交用户反馈
      description: |
        记录用户对该推荐会话当前展示餐厅的反馈。V0.2 每次提交生成一条反馈记录并更新画像，
        新画像从下一次新推荐开始生效，不即时改写当前会话候选池。
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
        - $ref: '#/components/parameters/AnonymousUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
            example:
              result: LIKE
      responses:
        '201':
          description: 反馈已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/RecommendationNotFound'

  /recommendations/{id}/deep-evidence:
    post:
      tags: [Recommendations]
      operationId: deepenRecommendationEvidence
      summary: 按需深挖当前餐厅
      description: |
        对推荐会话当前展示餐厅查询缓存或公开 Web Search Evidence，并返回独立的深挖风险结论。
        该结论不覆盖推荐会话冻结的基础风险，也不改变候选池、reroll 或 TasteProfile。
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
        - $ref: '#/components/parameters/AnonymousUserId'
      responses:
        '200':
          description: 深挖完成；外部来源失败时仍返回基础判断和来源状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepEvidenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/RecommendationNotFound'

  /recommendations/{id}/behaviors:
    post:
      tags: [Recommendations]
      operationId: submitRecommendationBehavior
      summary: 记录推荐行为
      description: |
        客户端只提交 ACCEPT、NAVIGATE 或 SKIP。相同 eventId 重试不会重复计数；
        行为只影响下一次新推荐，不改写当前冻结候选池。
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
        - $ref: '#/components/parameters/AnonymousUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBehaviorRequest'
      responses:
        '201':
          description: 行为首次记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorResponse'
        '200':
          description: eventId 幂等命中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/RecommendationNotFound'

  /users/me/data:
    delete:
      tags: [Privacy]
      operationId: deleteMyUserData
      summary: 删除当前匿名用户数据
      description: |
        删除当前匿名 UUID 关联的推荐会话、候选快照、行为、反馈、饮食历史、
        个性化画像和口味标注。餐厅、共享地图 Evidence 和其他用户数据不受影响。
        接口幂等，数据已经不存在时仍返回成功。
      parameters:
        - $ref: '#/components/parameters/AnonymousUserId'
      responses:
        '204':
          description: 用户数据已删除或原本不存在
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    AnonymousUserId:
      name: X-Anonymous-User-Id
      in: header
      required: true
      description: 客户端首次启动生成并持久化的匿名 UUID；V0.2 不要求登录。
      schema:
        type: string
        format: uuid
    RecommendationId:
      name: id
      in: path
      required: true
      description: 推荐会话 ID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 请求格式或字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
            message: 请求参数不合法
            fieldErrors:
              - field: radius
                message: 只能是 500、1000、2000 或 3000
            traceId: 01J5EXAMPLETRACE
    RecommendationNotFound:
      description: 推荐会话不存在、已过期，或不属于当前匿名用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RECOMMENDATION_NOT_FOUND
            message: 推荐已失效，请重新获取
            traceId: 01J5EXAMPLETRACE
    PoiProviderError:
      description: 上游 POI 服务暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: POI_PROVIDER_UNAVAILABLE
            message: 附近餐厅服务暂时不可用，请稍后再试
            traceId: 01J5EXAMPLETRACE

  schemas:
    CreateRecommendationRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: "GCJ-02 纬度；客户端通过 `uni.getLocation({ type: 'gcj02' })` 获取。"
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: GCJ-02 经度。
        radius:
          type: integer
          enum: [500, 1000, 2000, 3000]
          default: 1000
          description: 包含的距离上界，单位米。
        minDistance:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2999
          default: null
          description: 不包含的距离下界，单位米；省略时兼容旧客户端并从 0 米开始。
        maxBudget:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          default: null
          description: 包含的人均预算上界，单位人民币元；null 表示无上界。
        minBudget:
          type: integer
          nullable: true
          minimum: 1
          maximum: 9999
          default: null
          description: 不包含的人均预算下界；省略时兼容旧客户端并从 0 元开始。
        category:
          $ref: '#/components/schemas/CategoryFilterCode'
        dislikes:
          type: array
          default: []
          maxItems: 10
          uniqueItems: true
          description: 不想吃的食材、口味或品类短语；客户端输入支持空格、中英文逗号和换行分隔，服务端负责解释和过滤。
          items:
            type: string
            minLength: 1
            maxLength: 30

    RecommendationResponse:
      type: object
      additionalProperties: false
      required:
        - recommendationId
        - restaurant
        - risk
        - reasons
        - alternativesRemaining
      properties:
        recommendationId:
          type: string
          format: uuid
          description: 一次条件请求对应的推荐会话 ID，换一家和反馈时复用。
        restaurant:
          $ref: '#/components/schemas/RestaurantSummary'
        risk:
          $ref: '#/components/schemas/RiskAssessment'
        evidenceSummary:
          allOf:
            - $ref: '#/components/schemas/EvidenceSummary'
          nullable: true
          description: V0.3 多平台证据摘要；旧客户端可忽略，不包含第三方 POI ID 或内部匹配特征。
        personalization:
          allOf:
            - $ref: '#/components/schemas/Personalization'
          nullable: true
          description: V0.4 个性化摘要；旧客户端可忽略，Risk 仍保持独立。
        reasons:
          type: array
          minItems: 1
          maxItems: 5
          description: 服务端生成的推荐理由，前端仅展示。
          items:
            type: string
        searchNotice:
          allOf:
            - $ref: '#/components/schemas/SearchNotice'
          nullable: true
          description: 仅在召回未完整但已有所选环带内可用候选时返回；reroll 保持不变。
        alternativesRemaining:
          type: integer
          minimum: 0
          maximum: 5
          description: 还可展示的未见替代餐厅数量。
      example:
        recommendationId: 3c34f61d-cb41-4850-aafe-1505f3312f06
        restaurant:
          id: 8322a6eb-186b-4be7-b4e5-980c9ef93042
          name: 老街牛肉粉
          latitude: 28.2291
          longitude: 112.9412
          address: 麓山南路 123 号
          category:
            code: NOODLES
            label: 粉面
          distanceMeters: 620
          walkingMinutes: 8
          averagePrice: 26
          rating: 4.5
          businessStatus: OPEN
        risk:
          riskScore: 18
          riskLevel: LOW
          confidence: 0.82
          reasons: [评分稳定, 店铺信息完整, 价格位于正常范围]
          algorithmVersion: risk-v0.3.1
        evidenceSummary:
          matchStatus: MATCHED
          matchConfidence: 0.91
          consistency: CONFLICT
          ratingDifference: 0.7
          reason: 高德评分比百度高 0.7 分
          amap:
            status: AVAILABLE
            rating: 4.9
            tasteRating: null
            serviceRating: null
            environmentRating: null
            averagePrice: 58
            commentCount: null
          baidu:
            status: AVAILABLE
            rating: 4.2
            tasteRating: 4.0
            serviceRating: null
            environmentRating: null
            averagePrice: 62
            commentCount: 2600
        reasons: [距离近, 预算合适, 基础评分稳定, 数据完整度较高]
        searchNotice:
          code: SEARCH_INCOMPLETE
          message: 这一区间的餐厅还没搜完，先从已经找到的合适选项里为你选了一家。
        alternativesRemaining: 5

    SearchNotice:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [SEARCH_INCOMPLETE]
        message:
          type: string
          minLength: 1
          maxLength: 200

    RestaurantSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - latitude
        - longitude
        - address
        - category
        - distanceMeters
        - walkingMinutes
        - businessStatus
      properties:
        id:
          type: string
          format: uuid
          description: ELMA 内部标准餐厅 ID，不暴露第三方 Key。
        name:
          type: string
          maxLength: 120
        latitude:
          type: number
          format: double
          description: GCJ-02 纬度，可直接用于小程序地图导航。
        longitude:
          type: number
          format: double
          description: GCJ-02 经度，可直接用于小程序地图导航。
        address:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/RestaurantCategory'
        distanceMeters:
          type: integer
          minimum: 0
        walkingMinutes:
          type: integer
          minimum: 1
          description: 服务端步行时间估算值，不代表实时路线规划。
        averagePrice:
          type: integer
          nullable: true
          minimum: 0
          description: 人均价格，单位人民币元；上游缺失时为 null。
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
          description: POI 数据源原始评分；缺失时为 null。
        businessStatus:
          type: string
          enum: [OPEN, CLOSED, UNKNOWN]

    RestaurantCategory:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          $ref: '#/components/schemas/RestaurantCategoryCode'
        label:
          type: string
          maxLength: 30

    CategoryFilterCode:
      type: string
      default: MEAL
      enum: [MEAL, CHINESE, HOT_POT, BARBECUE, NOODLES, FAST_FOOD, WESTERN, JAPANESE_KOREAN, DESSERT_DRINK, ANY]
      example: MEAL
      description: |
        MEAL（正餐）仍是默认兜底；用户可选 CHINESE（中餐）、HOT_POT（火锅）、
        BARBECUE（烧烤）、NOODLES（粉面）、FAST_FOOD（小吃快餐）、WESTERN（西餐）、
        JAPANESE_KOREAN（日韩料理）、DESSERT_DRINK（饮品甜品）或 ANY（随便）进行纠偏。
        高德 POI 到产品品类的映射由服务端负责。

    RestaurantCategoryCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,31}$'
      maxLength: 32
      example: NOODLES
      description: ELMA 标准品类代码；展示名称使用同对象中的 label。

    RiskAssessment:
      type: object
      additionalProperties: false
      required: [riskScore, riskLevel, confidence, reasons, algorithmVersion]
      properties:
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        riskLevel:
          type: string
          enum: [LOW, MEDIUM_LOW, MEDIUM, HIGH]
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 当前风险评分的数据可信程度。
          example: 0.82
        reasons:
          type: array
          minItems: 1
          items:
            type: string
        algorithmVersion:
          type: string
          example: risk-v0.3.1

    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [matchStatus, consistency, reason, amap, baidu]
      properties:
        matchStatus:
          type: string
          enum: [MATCHED, AMBIGUOUS, NO_MATCH, UNAVAILABLE]
        matchConfidence:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        consistency:
          type: string
          enum: [CONSISTENT, SLIGHT_DIFFERENCE, CONFLICT, UNKNOWN]
        ratingDifference:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
        reason:
          type: string
          maxLength: 120
        amap:
          $ref: '#/components/schemas/EvidenceSourceSummary'
        baidu:
          $ref: '#/components/schemas/EvidenceSourceSummary'

    EvidenceSourceSummary:
      type: object
      additionalProperties: false
      required:
        - status
        - rating
        - tasteRating
        - serviceRating
        - environmentRating
        - averagePrice
        - commentCount
      properties:
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, UNAVAILABLE]
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
        tasteRating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
        serviceRating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
        environmentRating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
        averagePrice:
          type: integer
          nullable: true
          minimum: 0
        commentCount:
          type: integer
          nullable: true
          minimum: 0

    DeepEvidenceResponse:
      type: object
      additionalProperties: false
      required:
        - recommendationId
        - restaurantId
        - restaurantName
        - baseRisk
        - deepRisk
        - sourceCoverage
        - signals
        - consistency
        - links
        - cacheStatus
        - generatedAt
        - expiresAt
      properties:
        recommendationId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        restaurantName:
          type: string
          maxLength: 120
        baseRisk:
          $ref: '#/components/schemas/RiskAssessment'
        deepRisk:
          $ref: '#/components/schemas/RiskAssessment'
        structuredEvidence:
          allOf:
            - $ref: '#/components/schemas/EvidenceSummary'
          nullable: true
        sourceCoverage:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/DeepSourceCoverage'
        signals:
          $ref: '#/components/schemas/DeepSignalSummary'
        consistency:
          $ref: '#/components/schemas/DeepConsistency'
        links:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/DeepEvidenceLink'
        cacheStatus:
          type: string
          enum: [HIT, PARTIAL_HIT, MISS]
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    DeepSourceCoverage:
      type: object
      additionalProperties: false
      required: [source, status, resultCount]
      properties:
        source:
          type: string
          enum: [AMAP, BAIDU, BILIBILI, XIAOHONGSHU, DIANPING]
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, UNAVAILABLE]
        resultCount:
          type: integer
          nullable: true
          minimum: 0

    DeepSignalSummary:
      type: object
      additionalProperties: false
      required: [positive, negative, cautions]
      properties:
        positive:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 120 }
        negative:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 120 }
        cautions:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 120 }

    DeepConsistency:
      type: object
      additionalProperties: false
      required: [level, reason]
      properties:
        level:
          type: string
          enum: [HIGH, MEDIUM, LOW, UNKNOWN]
        reason:
          type: string
          maxLength: 160

    DeepEvidenceLink:
      type: object
      additionalProperties: false
      required: [source, title, url]
      properties:
        source:
          type: string
          enum: [BILIBILI, XIAOHONGSHU, DIANPING]
        title:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 1000
        publishedAt:
          type: string
          format: date-time
          nullable: true

    SubmitFeedbackRequest:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/FeedbackResult'
        flavorTags:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/FlavorTag'

    Personalization:
      type: object
      additionalProperties: false
      required: [tasteMatchScore, confidence, selectionMode, reasons, algorithmVersion]
      properties:
        tasteMatchScore: { type: number, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        selectionMode:
          type: string
          enum: [DEFAULT, PERSONALIZED, EXPLORATION]
        reasons:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 120 }
        algorithmVersion:
          type: string
          example: taste-v0.1

    SubmitBehaviorRequest:
      type: object
      additionalProperties: false
      required: [eventId, restaurantId, type]
      properties:
        eventId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        type:
          type: string
          enum: [ACCEPT, NAVIGATE, SKIP]

    BehaviorResponse:
      type: object
      additionalProperties: false
      required: [eventId, recommendationId, restaurantId, type, recordedAt, deduplicated]
      properties:
        eventId: { type: string, format: uuid }
        recommendationId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        type:
          type: string
          enum: [ACCEPT, NAVIGATE, SKIP]
        recordedAt: { type: string, format: date-time }
        deduplicated: { type: boolean }

    FlavorTag:
      type: string
      enum: [SPICY, SWEET, OILY, SALTY, LIGHT]

    FeedbackResponse:
      type: object
      additionalProperties: false
      required: [feedbackId, recommendationId, restaurantId, result, recordedAt]
      properties:
        feedbackId:
          type: string
          format: uuid
        recommendationId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/FeedbackResult'
        recordedAt:
          type: string
          format: date-time
      example:
        feedbackId: f57b640c-e4b2-4702-aa2f-2a9dacaf6910
        recommendationId: 3c34f61d-cb41-4850-aafe-1505f3312f06
        restaurantId: 8322a6eb-186b-4be7-b4e5-980c9ef93042
        result: LIKE
        recordedAt: '2026-08-19T09:30:00+08:00'

    FeedbackResult:
      type: string
      enum: [LIKE, NORMAL, DISLIKE]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给用户的中文错误提示。
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
          description: 用于服务端日志排查，不包含敏感信息。

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorCode:
      type: string
      description: 稳定、可供前端分支处理的错误码。
      enum:
        - VALIDATION_FAILED
        - NO_RECOMMENDATION_AVAILABLE
        - POI_SEARCH_INCOMPLETE
        - RECOMMENDATION_NOT_FOUND
        - POI_PROVIDER_UNAVAILABLE
        - FEEDBACK_ALREADY_RECORDED
