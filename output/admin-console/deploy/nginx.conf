# Existing console authentication applies to every analytics route.
location = /console {
    return 301 /console/;
}

location ^~ /console/data/v1/ {
    auth_basic "ELMA console";
    auth_basic_user_file /etc/nginx/elma-console.htpasswd;
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 4k;
    add_header Cache-Control "no-store" always;
}

location ^~ /console/api/v1/ {
    auth_basic "ELMA console";
    auth_basic_user_file /etc/nginx/elma-console.htpasswd;
    proxy_pass http://127.0.0.1:8081/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store";
}

location ^~ /console/ {
    alias /var/www/elma-console/;
    index index.html;
    charset utf-8;
    auth_basic "ELMA console";
    auth_basic_user_file /etc/nginx/elma-console.htpasswd;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
