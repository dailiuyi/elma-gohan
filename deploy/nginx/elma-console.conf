location = /console {
    return 301 /console/;
}

location ^~ /console/ {
    alias /var/www/elma-console/;
    index index.html;
    default_type text/html;
    charset utf-8;
    auth_basic "ELMA console";
    auth_basic_user_file /etc/nginx/elma-console.htpasswd;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
}
