spring:
  application:
    name: elma-gohan-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elma}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

elma:
  amap:
    key: ${AMAP_KEY:}
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    types: "050000"
    page-size: 25
    max-pages: 8
    target-candidates: 50
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    search-types-by-category:
      MEAL: "050100|050200|050300|050400"
      CHINESE: "050100"
      HOT_POT: "050117"
      BARBECUE: "050100"
      NOODLES: "050100"
      FAST_FOOD: "050300"
      WESTERN: "050201"
      JAPANESE_KOREAN: "050202|050203"
      DESSERT_DRINK: "050500|050600|050700|050800|050900"
      ANY: "050000"
    search-keywords-by-category:
      BARBECUE: 烧烤
    restaurant-typecode-prefix: "05"
    restaurant-type-root: 餐饮服务
    inference-min-signals: 2
    restaurant-keywords: [餐厅, 饭店, 菜馆, 酒楼, 中餐, 火锅, 烧烤, 粉面, 米粉, 米线, 面馆, 小吃, 快餐, 咖啡, 茶饮, 甜品]
    non-restaurant-type-keywords: [购物服务, 服装, 鞋帽, 商场, 购物中心, 超市, 便利店, 生活服务, 汽车服务, 住宿服务, 医疗保健, 公司企业]
    category-map:
      "050100": { code: CHINESE, label: 中餐厅 }
      "050200": { code: FOREIGN, label: 外国餐厅 }
      "050300": { code: SNACK, label: 小吃快餐 }
      "050400": { code: LEISURE_DINING, label: 休闲餐饮场所 }
      "050500": { code: COFFEE, label: 咖啡厅 }
      "050600": { code: TEA, label: 茶座 }
      "050700": { code: DRINKS, label: 冷饮店 }
      "050800": { code: DESSERT, label: 糕饼店 }
      "050900": { code: DESSERT, label: 甜品店 }
    category-rules:
      - code: HOT_POT
        label: 火锅
        keywords: [火锅, 麻辣烫, 麻辣香锅, 串串香]
      - code: BARBECUE
        label: 烧烤
        keywords: [烧烤, 烤肉, 烤串, 串店, 炭火]
      - code: NOODLES
        label: 粉面
        keywords: [粉面, 米粉, 米线, 面馆, 拉面, 螺蛳粉, 馄饨, 饺子馆]
      - code: JAPANESE_KOREAN
        label: 日韩料理
        keywords: [日本料理, 韩国料理, 日韩料理, 日式, 韩式, 寿司, 居酒屋]
      - code: WESTERN
        label: 西餐
        keywords: [西餐, 法式, 意式, 牛排, 披萨]
  baidu:
    enabled: ${BAIDU_ENABLED:true}
    ak: ${BAIDU_MAP_AK:}
    base-url: ${BAIDU_BASE_URL:https://api.map.baidu.com}
    query: 餐饮
    page-size: 20
    connect-timeout-ms: 1500
    read-timeout-ms: 2500
  deep-evidence:
    enabled: ${BRAVE_ENABLED:false}
    api-key: ${BRAVE_SEARCH_API_KEY:}
    base-url: ${BRAVE_BASE_URL:https://api.search.brave.com}
    connect-timeout-ms: ${BRAVE_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${BRAVE_READ_TIMEOUT_MS:3000}
    overall-timeout-ms: 4000
    result-count: ${BRAVE_RESULT_COUNT:10}
    evidence-cache-hours: ${DEEP_EVIDENCE_CACHE_HOURS:12}
    failure-cache-minutes: 5
    analysis-cache-hours: ${DEEP_ANALYSIS_CACHE_HOURS:6}
    max-links-per-source: 3
    entity-match-threshold: 0.72
    query-version: brave-query-v0.2
    analysis-algorithm-version: deep-evidence-v0.1
    risk-algorithm-version: deep-risk-v0.1
    store-suffixes: [旗舰店, 总店, 分店, 门店, 店]
    positive-phrases: [好吃, 推荐, 回购, 性价比, 分量足, 新鲜, 稳定]
    negative-phrases: [不好吃, 踩雷, 翻车, 难吃, 不新鲜, 偏咸, 偏油, 量少, 服务差, 太贵]
    operational-phrases: [排队, 等位, 上菜慢, 人多]
    marketing-phrases: [探店, 打卡, 网红, 种草, 必吃, 团购]
  entity-resolution:
    name-weight: 0.45
    coordinate-weight: 0.30
    address-weight: 0.15
    telephone-weight: 0.10
    accept-threshold: 0.78
    ambiguity-margin: 0.08
    minimum-name-similarity: 0.45
    maximum-distance-meters: 300
    sparse-match-minimum-name-similarity: 0.70
    sparse-match-maximum-distance-meters: 100
    matched-ttl-days: 30
    ambiguous-ttl-hours: 6
    no-match-ttl-minutes: 30
    evidence-ttl-hours: 6
    v2-evidence-ttl-hours: 24
  evidence:
    provider: ${EVIDENCE_PROVIDER:file}
    location: ${EVIDENCE_FILE:classpath:evidence/restaurant-evidence.json}
    max-reviews-per-restaurant: 200
  risk:
    algorithm-version: risk-v0.3.1
    rating:
      fair-min: 4.0
      good-min: 4.2
      excellent-min: 4.5
      excellent-risk: 0
      good-risk: 20
      fair-risk: 60
      poor-risk: 100
      missing-risk: 100
    template:
      min-reviews: 10
      ngram-size: 3
      min-text-length: 8
      similarity-threshold: 0.82
      ratio-start: 0.10
      ratio-full: 0.50
    burst:
      min-reviews: 20
      window-days: 3
      min-peak-count: 12
      min-history-days: 14
      ratio-start: 3.0
      ratio-full: 8.0
    trend:
      recent-days: 30
      baseline-days: 90
      min-recent-reviews: 5
      min-baseline-reviews: 10
      rating-delta: 0.4
      negative-rating-max: 2.0
      negative-ratio-delta: 0.2
      up-risk: 0
      stable-risk: 10
      down-risk: 100
      unknown-risk: 0
    data-insufficient:
      no-data-risk: 85
      unavailable-risk: 90
      target-reviews: 30
      sample-shortage-max-risk: 80
      poi-review-count-threshold: 10
      review-count-missing: 15
      opening-hours-missing: 10
      price-missing: 5
      price-anomaly: 20
      baidu-unavailable: 30
      baidu-no-match: 25
      baidu-rating-missing: 15
      amap-rating-missing: 20
      both-comment-count-missing: 10
      both-price-missing: 5
      both-opening-hours-missing: 5
    confidence:
      poi-weight: 0.25
      evidence-weight: 0.75
      target-reviews: 30
      amap-weight: 0.35
      baidu-weight: 0.35
      match-weight: 0.30
      single-source-weight: 0.50
      single-source-cap: 0.50
      freshness-window-days: 120
    weights:
      rating: 0.20
      template: 0.15
      burst: 0.10
      trend: 0.10
      data-insufficient: 0.25
      cross-platform-conflict: 0.20
    cross-platform:
      consistent-max-difference: 0.2
      conflict-start-difference: 0.7
      full-risk-difference: 1.0
      conflict-start-risk: 60
    price-anomaly-ratio: 1.5
    price-anomaly-min-pool-size: 5
    trend-target-sample: 30
    levels:
      low-max-inclusive: 20
      medium-low-max-inclusive: 40
      medium-max-inclusive: 60
  recommendation:
    algorithm-version: recommendation-v0.4.1
    top-k: 10
    pool-size: 6
    walking-speed-meters-per-minute: 80
    weights:
      restaurant-quality: 25
      risk-safety: 25
      taste-match: 20
      budget-fit: 12
      distance-fit: 10
      recent-diversity: 8
    uncertainty-risk: 50
    exploration-rate: 0.20
    exploration-minimum-confidence: 0.60
    exploration-bonus: 5
    exploration-negative-preference-threshold: -0.5
    category-confidence-penalty:
      verified: 0
      supported: 6
      inferred: 18
  taste:
    algorithm-version: taste-v0.1
    half-life-days: 90
    max-absolute-weight: 3.0
    confidence-target-samples: 5
    implicit-window-days: 30
    implicit-threshold: 3
    max-implicit-batch-adjustment: 0.25
    feedback:
      like: 1.0
      normal: 0.1
      dislike: -1.0
    behavior:
      accept: 0.1
      navigate: 0.1
      reroll: -0.1
      skip: -0.05
    price-band-upper-bounds: [30, 60, 100]
    distance-band-upper-bounds: [500, 1000, 2000]
