spring:
  application:
    name: elma-gohan-backend-test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:elma_test}
    username: ${DB_USERNAME:postgres}
    # 口令不设默认值,公开仓库不携带任何真实凭据;运行测试前设置 DB_PASSWORD
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health

elma:
  amap:
    key: test-key
    base-url: http://localhost:1
    types: "050000"
    page-size: 25
    max-pages: 2
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    category-map:
      "050100": { code: CHINESE, label: 中餐厅 }
      "050300": { code: SNACK, label: 小吃快餐 }
    category-rules:
      - code: HOT_POT
        label: 火锅
        keywords: [火锅, 麻辣烫, 麻辣香锅, 串串香]
      - code: BARBECUE
        label: 烧烤
        keywords: [烧烤, 烤肉]
      - code: NOODLES
        label: 粉面
        keywords: [粉面, 米粉, 米线, 面馆, 拉面]
      - code: JAPANESE_KOREAN
        label: 日韩料理
        keywords: [日本料理, 韩国料理, 日式, 韩式]
      - code: WESTERN
        label: 西餐
        keywords: [西餐, 牛排, 披萨]
  baidu:
    enabled: false
    ak: ""
    base-url: http://localhost:1
  deep-evidence:
    enabled: false
    api-key: ""
    base-url: http://localhost:1
    connect-timeout-ms: 500
    read-timeout-ms: 500
    overall-timeout-ms: 1000
    result-count: 10
    evidence-cache-hours: 12
    failure-cache-minutes: 5
    analysis-cache-hours: 6
    max-links-per-source: 3
    entity-match-threshold: 0.72
    analysis-algorithm-version: deep-evidence-v0.1
    risk-algorithm-version: deep-risk-v0.1
  evidence:
    provider: file
    location: classpath:evidence/test-evidence.json
    max-reviews-per-restaurant: 200
  risk:
    algorithm-version: risk-v0.3.1
    rating:
      fair-min: 4.0
      good-min: 4.2
      excellent-min: 4.5
    price-anomaly-ratio: 1.5
    price-anomaly-min-pool-size: 5
    trend-target-sample: 30
    confidence:
      freshness-window-days: 120
    levels:
      low-max-inclusive: 20
      medium-low-max-inclusive: 40
      medium-max-inclusive: 60
  recommendation:
    algorithm-version: recommendation-v0.4.1
    top-k: 10
    pool-size: 6
    walking-speed-meters-per-minute: 80
    weights:
      restaurant-quality: 25
      risk-safety: 25
      taste-match: 20
      budget-fit: 12
      distance-fit: 10
      recent-diversity: 8
    uncertainty-risk: 50
    exploration-rate: 0.20
    exploration-minimum-confidence: 0.60
    exploration-bonus: 5
    category-confidence-penalty:
      verified: 0
      supported: 6
      inferred: 18
  taste:
    algorithm-version: taste-v0.1
    half-life-days: 90
    max-absolute-weight: 3.0
    confidence-target-samples: 5
    implicit-window-days: 30
    implicit-threshold: 3
    max-implicit-batch-adjustment: 0.25
    feedback:
      like: 1.0
      normal: 0.1
      dislike: -1.0
    behavior:
      accept: 0.1
      navigate: 0.1
      reroll: -0.1
      skip: -0.05
    price-band-upper-bounds: [30, 60, 100]
    distance-band-upper-bounds: [500, 1000, 2000]
